<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>ورود به صفحه پلن‌ها | گزارش سایت کابل</title>
<link rel="stylesheet" href="reports-site.css">
<link rel="stylesheet" href="service-plans-lock.css?v=lock-1">
</head>
<body class="sp-locked" data-service-plans-locked="true">
<header class="sp-lock-header"><a class="site-brand" href="index.html"><span class="brand-mark" aria-hidden="true">◎</span><span>پرونده بازار کابل</span></a><a href="index.html">بازگشت به نقشه راه ←</a></header>
<main class="sp-lock-main">
<section class="sp-lock-card" aria-labelledby="sp-lock-title">
<div class="sp-lock-symbol" aria-hidden="true"><svg width="31" height="35" viewBox="0 0 31 35" fill="none"><path d="M8 15V10a7.5 7.5 0 0 1 15 0v5M5 15h21v17H5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 22v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
<span class="sp-lock-eyebrow">دسترسی به پیشنهاد اجرایی</span>
<h1 id="sp-lock-title">صفحه پلن‌ها</h1>
<p class="sp-lock-intro">برای مشاهده پلن‌ها، قیمت‌ها و جزئیات خدمات، رمز ورود را وارد کنید.</p>
<form id="sp-lock-form">
<label for="sp-lock-password">رمز ورود</label>
<div class="sp-password-field"><input id="sp-lock-password" name="password" type="password" inputmode="numeric" autocomplete="current-password" required maxlength="64" aria-describedby="sp-lock-error" placeholder="رمز را وارد کنید"><button id="sp-lock-reveal" type="button" aria-label="نمایش رمز" aria-pressed="false">نمایش</button></div>
<p id="sp-lock-error" class="sp-lock-error" role="status" aria-live="polite"></p>
<button class="sp-unlock-button" id="sp-lock-submit" type="submit">باز کردن گزارش ←</button>
</form>
<noscript><p class="sp-lock-error">برای باز کردن گزارش، جاوااسکریپت مرورگر باید فعال باشد.</p></noscript>
<div class="sp-lock-footer"><span>گزارش فقط پس از ورود باز می‌شود</span><a href="build-paths.html">مسیر ساخت ↗</a></div>
</section>
</main>
<!--ENCRYPTED_PLANS-->
<script src="service-plans-lock.js?v=lock-1"></script>
</body>
</html>
